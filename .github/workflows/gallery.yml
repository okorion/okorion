name: Refresh portfolio gallery
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Selected layout: split object archive"
        type: choice
        options: [keep, archive]
        default: keep
      style:
        description: "Finish: archive glass display"
        type: choice
        options: [keep, advanced]
        default: keep
  issues:
    types: [opened, edited, closed, reopened, deleted]
  schedule:
    - cron: "13,43 * * * *"
permissions:
  contents: read
  issues: read
concurrency:
  group: portfolio-gallery-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[Gallery] ') || startsWith(github.event.changes.title.from, '[Gallery] ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Collect bounded public guestbook entries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run gallery:collect
      - name: Check for changed site or gallery data
        id: changes
        run: node scripts/gallery/needs-refresh.mjs
      - if: steps.changes.outputs.changed == 'true'
        run: npm ci
      - if: steps.changes.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.changes.outputs.changed == 'true'
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Render selected layout in both themes and sizes
        if: steps.changes.outputs.changed == 'true'
        run: npm run gallery:render
      - name: Select layout
        if: steps.changes.outputs.changed == 'true'
        env:
          VARIANT: ${{ inputs.variant || 'keep' }}
          STYLE: ${{ inputs.style || 'keep' }}
        run: |
          if [ "$VARIANT" = keep ]; then
            VARIANT=$(node -p "JSON.parse(require('fs').readFileSync('config/gallery.json')).variant")
          fi
          if [ "$STYLE" = keep ]; then
            STYLE=$(node -p "JSON.parse(require('fs').readFileSync('config/gallery.json')).style || 'simple'")
          fi
          npm run gallery:readme -- "$VARIANT" "$STYLE"
      - name: Validate complete result
        if: steps.changes.outputs.changed == 'true'
        run: npm test
      - name: Publish only generated gallery changes
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/gallery/publish.mjs
