name: 소품으로 인사 남기기
description: 마음에 드는 무료 3D 소품을 골라 방명록에 인사를 남겨 주세요.
title: "[Gallery] 소품으로 인사 남기기"
body:
  - type: markdown
    attributes:
      value: |
        소품 하나를 골라 공개 README 방명록에 인사를 남깁니다. 최근 참여자 9명의 인사를 소품별로 모아 표시합니다. 계정당 가장 최근의 열린 참여 이슈 하나가 반영됩니다.
        소품은 Poly Haven에서 무료로 배포하는 CC0 모델입니다. 원래 재질과 색상으로 표시합니다.
        생성과 이미지 캐시 갱신에 몇 분이 걸릴 수 있습니다. 이슈를 닫으면 다음 갱신에서 제외됩니다.
        자유 텍스트·이름·아바타는 이미지에 표시하지 않습니다.
  - type: dropdown
    id: asset
    attributes:
      label: 소품
      options:
        - 빈티지 카메라 (Camera_01)
        - 레트로 게임패드 (gamepad)
        - 러버덕 (rubber_duck_toy)
        - 붐박스 (boombox)
        - 회중시계 (pocket_watch)
        - 대리석 체스 (chess_set)
        - 목조 코끼리 (carved_wooden_elephant)
        - 말 조각 (horse_head)
        - 조개 (lambis_shell)
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 공개 안내
      options:
        - label: 선택한 소품이 공개 README에 표시되는 데 동의합니다.
          required: true
