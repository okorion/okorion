<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" aria-labelledby="title desc" role="img" viewBox="0 0 720 400"><title id="title">오현규 — AI-native 개인 프로젝트</title><desc id="desc">개인 프로젝트 제작에서 방향, UI·UX, 프롬프트와 결과 피드백은 사용자. 코드 구현과 내부 구조 설계는 AI.</desc><style>text{font-family:&quot;Noto Sans KR&quot;,&quot;Malgun Gothic&quot;,&quot;Apple SD Gothic Neo&quot;,sans-serif}</style><rect width="718" height="398" x="1" y="1" fill="#11151d" stroke="#333d4e" rx="24"/><rect width="228" height="32" x="40" y="40" fill="#253257" rx="16"/><text x="56" y="62" fill="#a2b6ff" font-size="17" font-weight="700" letter-spacing="1">AI-NATIVE PROJECTS</text><text x="40" y="137" fill="#f5f7fb" font-size="48" font-weight="800" letter-spacing="-2">오현규 <tspan fill="#b6c0cf" font-size="30" font-weight="500" letter-spacing="0">/ okorion</tspan></text><text x="40" y="185" fill="#f5f7fb" font-size="25">결과를 보며 사용 흐름을 다듬습니다</text><g transform="translate(40 242)"><text x="0" y="-14" fill="#b6c0cf" font-size="18" font-weight="700">개인 프로젝트 제작 역할</text><rect width="640" height="118" fill="#1c2330" rx="18"/><text x="24" y="35" fill="#a2b6ff" font-size="21" font-weight="700">내 역할</text><text x="119" y="35" fill="#f5f7fb" font-size="21">방향 · UI/UX · 프롬프트 · 피드백</text><text x="24" y="66" fill="#b6c0cf" font-size="21" font-weight="700">AI 역할</text><text x="119" y="66" fill="#f5f7fb" font-size="21">코드 구현 · 내부 구조 설계</text><text x="24" y="96" fill="#b6c0cf" font-size="18">편집 도구 · 업무 흐름 · 시각 실험</text></g></svg>