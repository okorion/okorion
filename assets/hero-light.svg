<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" aria-labelledby="title desc" role="img" viewBox="0 0 1200 320"><title id="title">오현규 — AI-native 개인 프로젝트</title><desc id="desc">개인 프로젝트 제작에서 방향, UI·UX, 프롬프트와 결과 피드백은 사용자. 코드 구현과 내부 구조 설계는 AI.</desc><style>text{font-family:&quot;Noto Sans KR&quot;,&quot;Malgun Gothic&quot;,&quot;Apple SD Gothic Neo&quot;,sans-serif}</style><rect width="1198" height="318" x="1" y="1" fill="#fff" stroke="#e1e4e9" rx="24"/><rect width="228" height="32" x="56" y="40" fill="#e9eeff" rx="16"/><text x="72" y="62" fill="#3156d3" font-size="17" font-weight="700" letter-spacing="1">AI-NATIVE PROJECTS</text><text x="56" y="148" fill="#17212d" font-size="56" font-weight="800" letter-spacing="-2">오현규 <tspan fill="#526070" font-size="34" font-weight="500" letter-spacing="0">/ okorion</tspan></text><text x="56" y="201" fill="#17212d" font-size="27">결과를 보며 사용 흐름을 다듬습니다</text><text x="56" y="246" fill="#526070" font-size="20">편집 도구 · 업무 흐름 · 시각 실험</text><g transform="translate(700 56)"><text x="0" y="-14" fill="#526070" font-size="18" font-weight="700">개인 프로젝트 제작 역할</text><rect width="444" height="208" fill="#f4f5f7" rx="18"/><text x="24" y="44" fill="#3156d3" font-size="20" font-weight="700">내 역할</text><text x="24" y="91" fill="#17212d" font-size="24">방향 · UI/UX · 프롬프트 · 피드백</text><path stroke="#e1e4e9" d="M24 118H420"/><text x="24" y="161" fill="#526070" font-size="20" font-weight="700">AI 역할</text><text x="118" y="161" fill="#17212d" font-size="20">코드 구현 · 내부 구조 설계</text></g></svg>