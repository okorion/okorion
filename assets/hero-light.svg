<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hyounkyu Oh</title>
  <desc id="desc">Local-first AI, visual systems, and developer automation</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#f3f7ff"/>
      <stop offset="1" stop-color="#f8f5ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="orb" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#2563eb" stroke-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1d4ed8" flood-opacity=".14"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="28"/></clipPath>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}.orbit{animation:dash 18s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}.pulse-delay{animation-delay:-1.4s}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{transform:scale(1);opacity:.72}50%{transform:scale(1.16);opacity:1}}@media(prefers-reduced-motion:reduce){.orbit,.pulse{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="1090" cy="-20" r="210" fill="#8b5cf6" opacity=".055"/>
    <circle cx="900" cy="410" r="250" fill="#06b6d4" opacity=".055"/>
    <path d="M0 322C235 264 389 378 635 310s360-96 565-31" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".18"/>
    <g transform="translate(72 62)">
      <rect width="278" height="32" rx="16" fill="#ffffff" stroke="#dbeafe"/>
      <circle cx="17" cy="16" r="4" fill="#10b981" class="pulse"/>
      <text x="31" y="21" font-size="12" font-weight="700" letter-spacing="1.8" fill="#475569">OKORION / VISUAL SYSTEMS LAB</text>
      <text x="0" y="112" font-size="55" font-weight="800" letter-spacing="-2" fill="#0f172a">HYOUNKYU OH</text>
      <rect x="0" y="132" width="434" height="5" rx="2.5" fill="url(#accent)"/>
      <text x="0" y="176" font-size="22" font-weight="600" fill="#334155">I build tools that think, render, and collaborate.</text>
      <text x="0" y="207" font-size="15" fill="#64748b">Local-first AI · Visual Computing · Developer Automation</text>
      <g transform="translate(0 235)">
        <g><rect width="132" height="34" rx="17" fill="#eff6ff" stroke="#bfdbfe"/><text x="66" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">LOCAL-FIRST AI</text></g>
        <g transform="translate(144)"><rect width="105" height="34" rx="17" fill="#ecfeff" stroke="#a5f3fc"/><text x="52.5" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7490">WEBGPU</text></g>
        <g transform="translate(261)"><rect width="126" height="34" rx="17" fill="#f5f3ff" stroke="#ddd6fe"/><text x="63" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">AUTOMATION</text></g>
      </g>
    </g>
    <g transform="translate(900 178)" filter="url(#shadow)">
      <ellipse rx="204" ry="90" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 10" opacity=".35" class="orbit"/>
      <ellipse rx="145" ry="145" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 11" opacity=".3" class="orbit"/>
      <ellipse rx="95" ry="162" transform="rotate(62)" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 10" opacity=".32" class="orbit"/>
      <circle r="66" fill="url(#orb)" stroke="#ffffff" stroke-width="5"/>
      <circle r="31" fill="#ffffff" opacity=".82"/>
      <path d="M-21 3l18-17 20 7-15 9 19 7-25 15z" fill="url(#accent)" opacity=".9"/>
      <circle cx="-181" cy="-34" r="10" fill="#2563eb" class="pulse"/>
      <circle cx="126" cy="-77" r="9" fill="#8b5cf6" class="pulse pulse-delay"/>
      <circle cx="163" cy="58" r="8" fill="#06b6d4" class="pulse"/>
      <circle cx="-75" cy="131" r="7" fill="#10b981" class="pulse pulse-delay"/>
      <g fill="#475569" font-size="11" font-weight="700" letter-spacing="1">
        <text x="-222" y="-52">YJS</text><text x="139" y="-91">WEBLLM</text><text x="175" y="82">THREE.JS</text><text x="-107" y="153">REACT</text>
      </g>
    </g>
  </g>
</svg>
