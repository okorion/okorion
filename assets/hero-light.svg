<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">오현규 — AI-native 개인 프로젝트</title>
  <desc id="desc">개인 프로젝트 제작에서 방향, UI·UX, 프롬프트와 결과 피드백은 사용자. 코드 구현과 내부 구조 설계는 AI.</desc>
  <style>text{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}</style>
  <rect x="1" y="1" width="1198" height="318" rx="24" fill="#ffffff" stroke="#e1e4e9"/>
  <rect x="56" y="40" width="228" height="32" rx="16" fill="#e9eeff"/>
  <text x="72" y="62" font-size="17" font-weight="700" letter-spacing="1" fill="#3156d3">AI-NATIVE PROJECTS</text>
  <text x="56" y="148" font-size="56" font-weight="800" letter-spacing="-2" fill="#17212d">오현규 <tspan font-size="34" font-weight="500" letter-spacing="0" fill="#526070">/ okorion</tspan></text>
  <text x="56" y="201" font-size="27" fill="#17212d">결과를 보며 사용 흐름을 다듬습니다</text>
  <text x="56" y="246" font-size="20" fill="#526070">편집 도구 · 업무 흐름 · 시각 실험</text>
  <g transform="translate(700 56)">
    <text x="0" y="-14" font-size="18" font-weight="700" fill="#526070">개인 프로젝트 제작 역할</text>
    <rect width="444" height="208" rx="18" fill="#f4f5f7"/>
    <text x="24" y="44" font-size="20" font-weight="700" fill="#3156d3">내 역할</text>
    <text x="24" y="91" font-size="24" fill="#17212d">방향 · UI/UX · 프롬프트 · 피드백</text>
    <path d="M24 118H420" stroke="#e1e4e9"/>
    <text x="24" y="161" font-size="20" font-weight="700" fill="#526070">AI 역할</text>
    <text x="118" y="161" font-size="20" fill="#17212d">코드 구현 · 내부 구조 설계</text>

  </g>
</svg>
