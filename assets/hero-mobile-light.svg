<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">오현규 — AI-native 개인 프로젝트</title>
  <desc id="desc">개인 프로젝트 제작에서 방향, UI·UX, 프롬프트와 결과 피드백은 사용자. 코드 구현과 내부 구조 설계는 AI.</desc>
  <style>text{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}</style>
  <rect x="1" y="1" width="718" height="398" rx="24" fill="#ffffff" stroke="#e1e4e9"/>
  <rect x="40" y="40" width="228" height="32" rx="16" fill="#e9eeff"/>
  <text x="56" y="62" font-size="17" font-weight="700" letter-spacing="1" fill="#3156d3">AI-NATIVE PROJECTS</text>
  <text x="40" y="137" font-size="48" font-weight="800" letter-spacing="-2" fill="#17212d">오현규 <tspan font-size="30" font-weight="500" letter-spacing="0" fill="#526070">/ okorion</tspan></text>
  <text x="40" y="185" font-size="25" fill="#17212d">결과를 보며 사용 흐름을 다듬습니다</text>

  <g transform="translate(40 242)">
    <text x="0" y="-14" font-size="18" font-weight="700" fill="#526070">개인 프로젝트 제작 역할</text>
    <rect width="640" height="118" rx="18" fill="#f4f5f7"/>
    <text x="24" y="35" font-size="21" font-weight="700" fill="#3156d3">내 역할</text>
    <text x="119" y="35" font-size="21" fill="#17212d">방향 · UI/UX · 프롬프트 · 피드백</text>

    <text x="24" y="66" font-size="21" font-weight="700" fill="#526070">AI 역할</text>
    <text x="119" y="66" font-size="21" fill="#17212d">코드 구현 · 내부 구조 설계</text>
    <text x="24" y="96" font-size="18" fill="#526070">편집 도구 · 업무 흐름 · 시각 실험</text>
  </g>
</svg>
