<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Hyounkyu Oh — Frontend / Application Engineer</title>
  <desc id="desc">Editor and Builder state connected through save, load, Runtime, and real-environment verification</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#f3f7ff"/>
      <stop offset="1" stop-color="#f8f5ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#2563eb" stroke-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1d4ed8" flood-opacity=".13"/>
    </filter>
    <clipPath id="frame"><rect width="720" height="420" rx="28"/></clipPath>
    <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.flow{animation:flow 12s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{0%,100%{opacity:.68}50%{opacity:1;transform:scale(1.16)}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="720" height="420" fill="url(#bg)"/><rect width="720" height="420" fill="url(#grid)"/>
    <circle cx="690" cy="35" r="180" fill="#8b5cf6" opacity=".07"/><circle cx="620" cy="410" r="210" fill="#06b6d4" opacity=".07"/>
    <path d="M0 374c142-53 228 27 371-22 124-42 223-80 349-51" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".25"/>
    <g transform="translate(38 34)">
      <rect width="270" height="34" rx="17" fill="#ffffff" stroke="#dbe4f0"/><circle cx="18" cy="17" r="4" fill="#10b981" class="pulse"/>
      <text x="32" y="22" font-size="12" font-weight="700" letter-spacing="1.7" fill="#64748b">OKORION / PRODUCT DELIVERY</text>
      <text y="109" font-size="50" font-weight="800" letter-spacing="-1.8" fill="#0f172a">HYOUNKYU OH</text>
      <rect y="128" width="385" height="5" rx="2.5" fill="url(#accent)"/>
      <text y="176" font-size="24" font-weight="650" fill="#334155">Frontend / Application</text>
      <text y="208" font-size="24" font-weight="650" fill="#334155">Engineer</text>
      <text y="239" font-size="14" fill="#64748b">Editor · Builder · Runtime Integration</text>
      <g transform="translate(0 270)" filter="url(#shadow)">
        <rect width="644" height="108" rx="20" fill="#ffffff" stroke="#dbe4f0"/>
        <text x="20" y="28" font-size="10" font-weight="800" letter-spacing="1.4" fill="#64748b">PRODUCT FLOW</text>
        <g transform="translate(20 45)" font-size="10.5" font-weight="800">
          <g><rect width="112" height="42" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="56" y="26" text-anchor="middle" fill="#1d4ed8">EDITOR</text></g>
          <path d="M120 21h24" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 5" class="flow"/>
          <g transform="translate(152)"><rect width="112" height="42" rx="12" fill="#ecfeff" stroke="#a5f3fc"/><text x="56" y="26" text-anchor="middle" fill="#0e7490">SAVE / LOAD</text></g>
          <path d="M272 21h24" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 5" class="flow"/>
          <g transform="translate(304)"><rect width="112" height="42" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/><text x="56" y="26" text-anchor="middle" fill="#6d28d9">RUNTIME</text></g>
          <path d="M424 21h24" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 5" class="flow"/>
          <g transform="translate(456)"><rect width="148" height="42" rx="12" fill="#f3f7ff" stroke="#dbe4f0"/><text x="74" y="26" text-anchor="middle" fill="#334155">DEVICE · FIELD</text></g>
        </g>
      </g>
    </g>
  </g>
</svg>
